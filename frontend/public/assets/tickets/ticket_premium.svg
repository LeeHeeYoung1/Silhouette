<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="premGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#CC7000"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="100%" stop-color="#910038"/>
    </linearGradient>
    <filter id="premShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#22201E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="80" cy="60" r="56" fill="#FFA500" opacity="0.2"/>

  <!-- Stack 1 (Bottom) -->
  <g transform="translate(25, 20) rotate(-16 55 35)" opacity="0.75" filter="url(#premShadow)">
    <rect x="0" y="0" width="105" height="58" rx="8" fill="#E68A00"/>
  </g>
  <!-- Stack 2 (Middle) -->
  <g transform="translate(27, 24) rotate(10 55 35)" opacity="0.9" filter="url(#premShadow)">
    <rect x="0" y="0" width="105" height="58" rx="8" fill="#FFB703"/>
  </g>
  <!-- Stack 3 (Front Main Ticket Box/Pass) -->
  <g transform="translate(26, 28) rotate(-1 55 35)" filter="url(#premShadow)">
    <path d="M 8 0 H 97 A 8 8 0 0 1 105 8 V 22 A 6 6 0 0 0 105 34 V 50 A 8 8 0 0 1 97 58 H 8 A 8 8 0 0 1 0 50 V 34 A 6 6 0 0 0 0 22 V 8 A 8 8 0 0 1 8 0 Z" fill="url(#premGold)"/>
    
    <!-- Red/Pink Luxury Ribbon Badge -->
    <path d="M 16 0 L 26 0 L 26 26 L 21 21 L 16 26 Z" fill="url(#ribbonGrad)"/>
    
    <!-- Gold Medallion -->
    <circle cx="56" cy="29" r="17" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="56" cy="29" r="14" fill="#FFEAA7"/>
    <!-- Crown icon -->
    <path d="M 48 33 L 49 25 L 53 28 L 56 23 L 59 28 L 63 25 L 64 33 Z" fill="#D35400"/>
    <circle cx="56" cy="31" r="1.5" fill="#FFFFFF"/>
    
    <!-- Perforation line -->
    <line x1="82" y1="6" x2="82" y2="52" stroke="#8A4B00" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Barcode lines -->
    <line x1="88" y1="16" x2="98" y2="16" stroke="#683400" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="23" x2="100" y2="23" stroke="#683400" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="89" y1="30" x2="97" y2="30" stroke="#683400" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="87" y1="37" x2="99" y2="37" stroke="#683400" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="89" y1="44" x2="96" y2="44" stroke="#683400" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Gem/Star Flashes -->
  <polygon points="136,18 139,26 147,29 139,32 136,40 133,32 125,29 133,26" fill="#FFD700"/>
  <polygon points="20,74 23,80 29,83 23,86 20,92 17,86 11,83 17,80" fill="#FF2A6D"/>
  <polygon points="132,84 134,88 138,90 134,92 132,96 130,92 126,90 130,88" fill="#FFA500"/>
</svg>
