<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ticketGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="45%" stop-color="#FFD34E"/>
      <stop offset="100%" stop-color="#E5A610"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD34E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD34E" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#22201E" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Glow Background -->
  <circle cx="80" cy="60" r="50" fill="url(#glowGrad1)"/>
  
  <!-- Single Gold Ticket -->
  <g transform="translate(25, 25) rotate(-4 55 35)" filter="url(#shadow1)">
    <!-- Ticket Body -->
    <path d="M 10 0 
             H 100 
             A 10 10 0 0 1 110 10 
             V 26 
             A 8 8 0 0 0 110 42 
             V 60 
             A 10 10 0 0 1 100 70 
             H 10 
             A 10 10 0 0 1 0 60 
             V 42 
             A 8 8 0 0 0 0 26 
             V 10 
             A 10 10 0 0 1 10 0 Z" 
          fill="url(#ticketGold1)"/>
    
    <!-- Inner dashed border -->
    <line x1="80" y1="8" x2="80" y2="62" stroke="#B87C00" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Ticket Icon & Text -->
    <circle cx="45" cy="35" r="16" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 45 25 C 41 25 38 28 38 32 C 38 38 45 44 45 44 C 45 44 52 38 52 32 C 52 28 49 25 45 25 Z" fill="#E5A610"/>
    <circle cx="45" cy="33" r="3.5" fill="#FFFFFF"/>
    
    <!-- Mini barcode/lines on right -->
    <line x1="90" y1="20" x2="100" y2="20" stroke="#8E5E00" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="28" x2="102" y2="28" stroke="#8E5E00" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="90" y1="36" x2="98" y2="36" stroke="#8E5E00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="88" y1="44" x2="102" y2="44" stroke="#8E5E00" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="92" y1="52" x2="98" y2="52" stroke="#8E5E00" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkles -->
  <polygon points="125,22 128,29 135,32 128,35 125,42 122,35 115,32 122,29" fill="#FFD34E"/>
  <polygon points="30,85 32,89 36,91 32,93 30,97 28,93 24,91 28,89" fill="#FFD34E" opacity="0.8"/>
</svg>
