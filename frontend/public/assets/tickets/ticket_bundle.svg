<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bundleGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#FFD34E"/>
      <stop offset="100%" stop-color="#E09C05"/>
    </linearGradient>
    <linearGradient id="bundleGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="40%" stop-color="#FFDF6D"/>
      <stop offset="100%" stop-color="#F2AC12"/>
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="bundleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#22201E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Radiant Glow -->
  <circle cx="80" cy="62" r="54" fill="#FFD34E" opacity="0.25"/>

  <!-- Back Ticket -->
  <g transform="translate(30, 20) rotate(-12 50 35)" filter="url(#bundleShadow)" opacity="0.85">
    <path d="M 8 0 H 92 A 8 8 0 0 1 100 8 V 24 A 6 6 0 0 0 100 36 V 52 A 8 8 0 0 1 92 60 H 8 A 8 8 0 0 1 0 52 V 36 A 6 6 0 0 0 0 24 V 8 A 8 8 0 0 1 8 0 Z" fill="#E8A717"/>
    <line x1="72" y1="8" x2="72" y2="52" stroke="#9E6800" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Middle Ticket -->
  <g transform="translate(33, 24) rotate(8 50 35)" filter="url(#bundleShadow)" opacity="0.95">
    <path d="M 8 0 H 92 A 8 8 0 0 1 100 8 V 24 A 6 6 0 0 0 100 36 V 52 A 8 8 0 0 1 92 60 H 8 A 8 8 0 0 1 0 52 V 36 A 6 6 0 0 0 0 24 V 8 A 8 8 0 0 1 8 0 Z" fill="url(#bundleGold1)"/>
    <line x1="72" y1="8" x2="72" y2="52" stroke="#B37C00" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Front Ticket -->
  <g transform="translate(30, 30) rotate(-2 50 35)" filter="url(#bundleShadow)">
    <path d="M 8 0 H 92 A 8 8 0 0 1 100 8 V 24 A 6 6 0 0 0 100 36 V 52 A 8 8 0 0 1 92 60 H 8 A 8 8 0 0 1 0 52 V 36 A 6 6 0 0 0 0 24 V 8 A 8 8 0 0 1 8 0 Z" fill="url(#bundleGold2)"/>
    <line x1="72" y1="6" x2="72" y2="54" stroke="#A86F00" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Heart & Star Emblem -->
    <circle cx="38" cy="30" r="16" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 38 21 C 34 21 31 24 31 28 C 31 34 38 40 38 40 C 38 40 45 34 45 28 C 45 24 42 21 38 21 Z" fill="url(#honeyGrad)"/>
    <circle cx="38" cy="28.5" r="3" fill="#FFFFFF"/>
    
    <!-- Barcode lines -->
    <line x1="80" y1="18" x2="92" y2="18" stroke="#7A4C00" stroke-width="2" stroke-linecap="round"/>
    <line x1="78" y1="25" x2="94" y2="25" stroke="#7A4C00" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="81" y1="32" x2="91" y2="32" stroke="#7A4C00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="39" x2="93" y2="39" stroke="#7A4C00" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="82" y1="46" x2="90" y2="46" stroke="#7A4C00" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Big Sparkles -->
  <polygon points="135,16 138,24 146,27 138,30 135,38 132,30 124,27 132,24" fill="#FF5C00"/>
  <polygon points="135,18 137,24 143,27 137,30 135,36 133,30 127,27 133,24" fill="#FFD34E"/>
  <polygon points="22,78 24,82 28,84 24,86 22,90 20,86 16,84 20,82" fill="#FFB800"/>
  <polygon points="128,85 130,88 133,89 130,90 128,93 126,90 123,89 126,88" fill="#FFD34E"/>
</svg>
